<label class="block text-sm font-semibold text-slate-900">
  {{ label() }}

  <select
    #menu
    class="mt-1 block w-full rounded-lg border border-slate-400 bg-white p-2"
    (change)="onSelectionChange(menu)"
    [disabled]="disabled() || loading()"
    [attr.aria-busy]="loading()"
  >
    <option value="" [selected]="value() === null" [disabled]="!allowClear()">
      {{ placeholder() }}
    </option>

    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>

  @if (loading()) {
    <span role="status" class="mt-2 flex items-center gap-2 text-emerald-700">
      <span
        aria-hidden="true"
        class="h-4 w-4 rounded-full border-2 border-current border-r-transparent motion-safe:animate-spin"
      ></span>
      Cargando opciones…
    </span>
  }
</label>
