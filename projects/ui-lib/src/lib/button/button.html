<button
  type="button"
  class="inline-flex items-center gap-2 rounded-lg font-mono font-semibold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 disabled:opacity-50"
  [class]="variantClasses[variant()] + ' ' + sizeClasses[size()]"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading()"
  (click)="onClick()"
>
  @if (loading()) {
    <span
      class="h-4 w-4 rounded-full border-2 border-current border-r-transparent motion-safe:animate-spin"
      aria-hidden="true"
    ></span>
  }
  {{ label() }}
</button>
